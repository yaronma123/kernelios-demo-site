<!doctype html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="עשרה חדרי לינוקס לתרגול בטרמינל מדומה | Ten Linux rooms with a simulated terminal">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Linux Rooms</title>
<style>
:root{color-scheme:dark;--base:#0b1017;--panel:#101822;--terminal:#080e15;--edge:#253344;--muted:#a0afbf;--text:#ecf2f8;--green:#68f1ae;--soft:#142d28;--gold:#ffc67d;--blue:#8acbff;--red:#ff9f9b;--mono:ui-monospace,"Cascadia Code","Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 70% 0%,#14232e 0%,transparent 45%),var(--base);color:var(--text);font:1rem/1.55 system-ui,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}
button:disabled{cursor:default}
header{border-bottom:1px solid var(--edge);background:#0d141ded}
.top{min-height:67px;max-width:1280px;margin:auto;padding:10px 30px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand,.controls,.actions,.terminal-status{display:flex;align-items:center;gap:10px}
.brand{font:700 1rem var(--mono);letter-spacing:.035em;white-space:nowrap}
.brand-mark{width:36px;height:36px;border:1px solid #346b56;border-radius:9px;display:grid;place-items:center;background:var(--soft);color:var(--green);font:700 1.12rem var(--mono)}
.button{border:1px solid #34465a;border-radius:8px;background:#172331;padding:7px 13px;font-size:.875rem;font-weight:650;min-height:36px}
.button:hover{background:#213247;border-color:#607a95}
.button.primary{background:var(--green);border-color:var(--green);color:#092119}
.button.primary:hover{background:#a4ffd2}
.button.quiet{background:transparent;color:var(--muted)}
.button.quiet:hover{color:var(--text);background:#1b2b3c}
main{max-width:1280px;margin:auto;padding:30px 30px 24px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px;padding:24px 28px;border:1px solid #2c4350;border-radius:15px;background:radial-gradient(ellipse at 20% 120%,#16372e 0%,transparent 60%),repeating-linear-gradient(90deg,#7cffc406 0 1px,transparent 1px 36px),repeating-linear-gradient(0deg,#7cffc406 0 1px,transparent 1px 36px),#111e27}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.95rem,4vw,3rem);line-height:1.12;letter-spacing:-.025em}
.hero p{margin-top:8px;color:#b7c9d5}
.progress{width:min(244px,37%);flex:none;padding:12px 15px;border:1px solid #324957;border-radius:10px;background:#0c161ddd}
.progress-copy{display:flex;justify-content:space-between;align-items:center;gap:13px;color:#c6d3dd;font-size:.875rem}
.progress-copy strong{font:700 1.1rem var(--mono);color:var(--green);white-space:nowrap}
progress{display:block;margin-top:8px;width:100%;height:7px;border:0;border-radius:20px;overflow:hidden;background:#273745;accent-color:var(--green)}
progress::-webkit-progress-bar{background:#273745}
progress::-webkit-progress-value{background:var(--green);border-radius:20px}
progress::-moz-progress-bar{background:var(--green);border-radius:20px}
.layout{display:grid;grid-template-columns:264px minmax(0,1fr);gap:18px;align-items:start}
.panel{border:1px solid var(--edge);border-radius:13px;background:var(--panel);min-width:0}
.sidebar{padding:14px 10px 10px}
.sidebar h2{font-size:1rem;margin:0 9px 11px}
.room-list{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.room{width:100%;display:flex;gap:9px;align-items:center;text-align:start;padding:7px;border-radius:8px;border:1px solid transparent;background:transparent;min-height:45px}
.room:hover:enabled{background:#1a2836}
.room[aria-current="true"]{background:#142b2a;border-color:#346251}
.room:disabled{color:#a0acbb}
.room-num{width:31px;height:28px;display:grid;place-items:center;border-radius:5px;background:#1e2b3a;color:#b9c9d9;font:600 .8rem var(--mono);flex:none}
.room[aria-current="true"] .room-num,.room.done .room-num{background:#21483a;color:var(--green)}
.room-name{flex:1;font-size:.875rem;font-weight:650;line-height:1.22}
.room-state{flex:none;color:var(--muted);font-size:.75rem}
.room.done .room-state{color:var(--green);font-size:.95rem}
.room[aria-current="true"]:not(.done) .room-state{color:var(--green)}
.workbench{display:grid;gap:13px;min-width:0}
.mission{padding:17px 19px}
.mission-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.mission h2{font-size:1.5rem;line-height:1.3}
.level{font-size:.875rem;border:1px solid #386552;padding:2px 9px;border-radius:6px;background:#18332b;color:var(--green)}
.level[data-level="1"]{background:#192c40;color:var(--blue);border-color:#385c7b}
.level[data-level="2"]{background:#392a1d;color:var(--gold);border-color:#735433}
.mission p{color:#c5d1dd}
.mission p+p{margin-top:5px}
.mission code,.hint code,.guide code{display:inline-block;direction:ltr;unicode-bidi:isolate;font:.9em var(--mono);background:#1b2a38;color:#b7e0ff;padding:1px 5px;border-radius:4px;max-width:100%;overflow-wrap:anywhere}
.actions{margin-top:12px;flex-wrap:wrap}
.hint{margin-top:10px;border-inline-start:3px solid var(--gold);background:#211e1c;padding:8px 11px;border-radius:5px;color:#f4d9b6}
[hidden]{display:none!important}
.terminal{overflow:hidden;display:flex;flex-direction:column;background:var(--terminal);direction:ltr}
.terminal-bar{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#14202c;border-bottom:1px solid var(--edge);padding:6px 11px;min-height:43px}
.terminal-title{font:650 .875rem var(--mono);color:#d9e9f7}
.terminal-status{gap:7px;font:550 .8rem var(--mono);color:#bdccdb}
.dot{width:7px;height:7px;border-radius:100%;background:var(--green);box-shadow:0 0 12px #68f1ae85}
.terminal-bar .button{min-height:29px;padding:3px 8px}
.transcript{height:clamp(245px,36vh,400px);padding:13px 15px;overflow:auto;scrollbar-color:#384e63 var(--terminal);overscroll-behavior:contain}
.line{margin:0 0 5px;font:400 .875rem/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:#c9d8e7}
.line[dir="rtl"]{text-align:right;font-family:system-ui,Arial,sans-serif}
.line[data-tone="cmd"]{color:#f3f7ff}
.line[data-tone="info"]{color:var(--blue)}
.line[data-tone="success"]{color:var(--green)}
.line[data-tone="error"]{color:var(--red)}
.line[data-tone="hint"]{color:var(--gold)}
.prompt-form{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:10px 13px;border-top:1px solid #203040;background:#0c141d}
.prompt-text{color:var(--green);font:650 .875rem var(--mono);overflow-wrap:anywhere}
.prompt-form input{flex:1;min-width:95px;width:0;background:transparent;border:0;color:#eff6ff;padding:6px 4px;border-radius:4px;font:.875rem var(--mono)}
.prompt-form input::placeholder{color:#8e9dad}
.below{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.below p{color:var(--muted);font-size:.875rem}
.guide{width:min(580px,calc(100% - 28px));max-height:88vh;overflow:auto;color:var(--text);background:#14202c;border:1px solid #3a5062;border-radius:13px;padding:21px}
.guide::backdrop{background:#050910c9}
.guide h2{margin-bottom:9px}
.guide p{margin-bottom:10px;color:#c7d5e0}
.guide ul{margin:0 0 15px;padding-inline-start:23px}
.guide li{padding:3px 0}
@media(max-width:760px){
 .top,main{padding-inline:16px}
 main{padding-top:18px}
 .hero{padding:17px;gap:13px;margin-bottom:15px}
 .layout{grid-template-columns:minmax(0,1fr)}
 .workbench{grid-row:1}
 .room-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:450px){
 .top,main{padding-inline:11px}
 .hero{align-items:stretch;flex-direction:column}
 .progress{width:100%}
 .room-list{grid-template-columns:minmax(0,1fr)}
 .controls{gap:5px}
 .button{padding-inline:8px}
 .mission{padding:13px}
 .brand{gap:6px;font-size:.875rem}
 .brand-mark{width:28px;height:29px}
}
</style>
</head><body>
<header>
 <div class="top">
  <div class="brand" dir="ltr"><span class="brand-mark" aria-hidden="true">&gt;_</span>Linux Rooms</div>
  <div class="controls">
   <button class="button quiet" id="offline" type="button"></button>
   <button class="button quiet" id="guide-open" type="button"></button>
   <button class="button" id="language" type="button" dir="ltr"></button>
  </div>
 </div>
</header>
<main>
 <section class="hero" aria-labelledby="page-title">
  <div><h1 id="page-title"></h1><p id="tagline"></p></div>
  <div class="progress">
   <div class="progress-copy"><span id="progress-label"></span><strong id="score" dir="ltr"></strong></div>
   <progress id="progress" max="10" value="0" aria-labelledby="progress-label"></progress>
  </div>
 </section>
 <div class="layout">
  <nav class="panel sidebar" aria-labelledby="map-title"><h2 id="map-title"></h2><ol id="map" class="room-list"></ol></nav>
  <div class="workbench">
   <section class="panel mission" aria-labelledby="room-title">
    <div class="mission-top"><h2 id="room-title" tabindex="-1"></h2><span class="level" id="level"></span></div>
    <p id="brief"></p><p id="objective"></p>
    <div class="actions">
     <button class="button" id="hint-button" type="button" aria-controls="hint"></button>
     <button class="button primary" id="next" type="button" hidden=""></button>
    </div>
    <p id="hint" class="hint" aria-live="polite" hidden=""></p>
   </section>
   <section class="panel terminal" aria-labelledby="terminal-title">
    <div class="terminal-bar"><span class="terminal-status"><span class="dot" aria-hidden="true"></span><span id="terminal-title" class="terminal-title"></span></span><button class="button quiet" id="clear" type="button" dir="auto"></button></div>
    <div id="transcript" class="transcript" role="log" aria-live="polite" tabindex="0" aria-labelledby="terminal-title"></div>
    <form id="prompt-form" class="prompt-form">
     <label for="command" id="prompt" class="prompt-text"></label>
     <input id="command" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" maxlength="320">
     <button class="button primary" id="run" type="submit" dir="auto"></button>
    </form>
   </section>
   <div class="below"><p id="storage-status" role="status"></p></div>
  </div>
 </div>
</main>
<dialog id="guide" class="guide" aria-labelledby="guide-title">
 <h2 id="guide-title"></h2><p id="guide-text"></p><ul id="guide-list"></ul>
 <form method="dialog"><button class="button primary" id="guide-close" type="button"></button></form>
</dialog>
<script>
'use strict';
// Room copy uses backticks as delimiters for inline command names.
const rooms = [
 {title:['ניווט ראשון','First Steps'],level:0,
  brief:['זה עתה התחברת לשרת התרגול. פתק קבלת הפנים מחכה בתיקיית `briefing`.','You just connected to the practice host. A welcome note is waiting in the `briefing` directory.'],
  task:['נווט לתיקייה, קרא את הפתק והגש את הקוד באמצעות `submit CODE`.','Enter the directory, read the note, then submit its code with `submit CODE`.'],
  hints:[['בדוק איפה אתה עם `pwd`, והצג את התוכן עם `ls`.','Check your current directory with `pwd`, then list its contents with `ls`.'],['נסה `cd briefing` ואז `cat welcome.txt`. הגש את הערך שאחרי `CODE=`.','Try `cd briefing` then `cat welcome.txt`. Submit the value after `CODE=`.']],
  files:{'briefing/welcome.txt':'Welcome to Linux Rooms.\nCODE=ORBIT-17','readme.txt':'The welcome note is in briefing.'},answer:['orbit-17']},
 {title:['תיקיות וקבצים נסתרים','Hidden Files'],level:0,
  brief:['הצוות שמר את קוד המלאי בקובץ נסתר בתוך `archive`.','The team stored the inventory code in a hidden file inside `archive`.'],
  task:['אתר את הקובץ והגש את הקוד שבו.','Find the hidden file and submit its code.'],
  hints:[['בלינוקס, שם שמתחיל בנקודה מוסתר ברשימה רגילה. נסה `ls -a archive`.','Linux hides names beginning with a dot from ordinary listings. Try `ls -a archive`.'],['פתח את `archive/.inventory` עם `cat`.','Read `archive/.inventory` with `cat`.']],
  files:{'archive/notes.txt':'Quarterly inventory notes.','archive/.inventory':'inventory status: verified\nCODE=CEDAR-42','readme.txt':'Inventory moved to archive.'},answer:['cedar-42']},
 {title:['חיפוש בקבצים','Search the Logs'],level:0,
  brief:['בדיקת גיבוי נכשלה. הפרטים מופיעים באחת משורות היומן `backup.log`.','A backup check failed. The details appear on one line of `backup.log`.'],
  task:['מצא את השורה שמכילה `ERROR` והגש את הערך של `job`.','Find the line marked `ERROR` and submit its `job` value.'],
  hints:[['הפקודה `grep` מחזירה שורות שמכילות את הטקסט שחיפשת.','The `grep` command returns lines containing the text you search for.'],['נסה `grep ERROR backup.log`.','Try `grep ERROR backup.log`.']],
  files:{'backup.log':'08:00 INFO job=delta result=started\n08:02 INFO job=delta result=ok\n08:03 WARN job=mesa result=retry\n08:04 ERROR job=birch result=checksum_mismatch\n08:09 INFO job=mesa result=ok\n08:12 INFO job=maple result=ok'},answer:['birch']},
 {title:['צינורות וספירה','Pipes and Counting'],level:1,
  brief:['כל שורה ב־`queue.txt` מציינת בקשה שנכנסה לאחד התורים.','Each line in `queue.txt` records one request sent to a queue.'],
  task:['מצא את התור השכיח ביותר והגש את שמו ואת מספר ההופעות, למשל `submit alpha 4`.','Find the busiest queue and submit its name and count, for example `submit alpha 4`.'],
  hints:[['התו `|` מעביר פלט בין פקודות. `uniq -c` סופרת שורות זהות סמוכות, לכן כדאי למיין תחילה.','The `|` character passes output between commands. `uniq -c` counts adjacent identical lines, so sort first.'],['נסה `sort queue.txt | uniq -c | sort -nr`.','Try `sort queue.txt | uniq -c | sort -nr`.']],
  files:{'queue.txt':'amber\nblue\nember\nblue\namber\nblue\nember\nblue\namber\nblue\nember\nblue'},answer:['blue','6']},
 {title:['הרשאות קבצים','File Permissions'],level:1,
  brief:['רק לבעלים של `report.txt` מותר לקרוא ולכתוב בו. בדוק את ההרשאות ותקן אותן.','Only the owner of `report.txt` should be able to read or write it. Inspect and correct its permissions.'],
  task:['עדכן את הרשאות הקובץ והגש את הערך המספרי בן שלוש הספרות שקבעת.','Set the file permissions, then submit the three-digit mode you applied.'],
  hints:[['נסה `ls -l report.txt`. לקריאה יש ערך 4, לכתיבה 2. סדר הספרות הוא בעלים, קבוצה, אחרים.','Try `ls -l report.txt`. Read is 4 and write is 2. The digits represent owner, group, and others.'],['הפקודה `chmod 600 report.txt` מעניקה קריאה וכתיבה לבעלים בלבד.','The command `chmod 600 report.txt` grants read and write access to the owner only.']],
  files:{'report.txt':['Training report — internal use only.','644']},answer:['600'],check:s=>s.files.get('/home/student/report.txt').mode==='600'},
 {title:['תהליכים פעילים','Running Processes'],level:1,
  brief:['אפליקציית הניטור הציפה התראה על צריכת מעבד. הטבלה המדומה כוללת תהליכים פעילים.','Monitoring flagged high CPU use. The simulated process table shows what is running.'],
  task:['זהה את התהליך עם `%CPU` הגבוה ביותר והגש את ה־`PID` שלו.','Identify the process with the highest `%CPU` and submit its `PID`.'],
  hints:[['`ps aux` מציגה תהליכים ואת השימוש שלהם במעבד.','`ps aux` lists processes and their CPU usage.'],['אפשר למיין לפי שימוש במעבד באמצעות `ps aux --sort=-%cpu`.','You can sort by CPU usage with `ps aux --sort=-%cpu`.']],
  answer:['1842']},
 {title:['שירותי מערכת','System Services'],level:1,
  brief:['השירות `backup.service` נעצר. בדוק את מצבו והשווה אותו ליומן של השירות.','The `backup.service` unit stopped. Check its status and read its journal.'],
  task:['הגש את הערך של `reason` שמופיע בשורת הכשל ביומן.','Submit the `reason` value on the failure line in the journal.'],
  hints:[['נסה `systemctl status backup.service` כדי לבדוק את מצב השירות.','Try `systemctl status backup.service` to check the service status.'],['קרא את היומן באמצעות `journalctl -u backup.service` וחפש את השורה עם `ERROR`.','Read the journal with `journalctl -u backup.service` and look for the `ERROR` line.']],
  answer:['quota_exceeded']},
 {title:['רשת מקומית','Local Network'],level:2,
  brief:['שירות בריאות מקומי מאזין על כתובת loopback במכונת התרגול.','A local health-check service is listening on the practice host’s loopback address.'],
  task:['מצא את הפורט שבו מאזין `healthd` והגש את מספר הפורט.','Find the port that `healthd` is listening on and submit the port number.'],
  hints:[['`ip addr` מציגה כתובות מקומיות. כתובת ה־loopback של IPv4 היא `127.0.0.1`.','`ip addr` shows local addresses. The IPv4 loopback address is `127.0.0.1`.'],['נסה `ss -lntp | grep healthd`. מספר הפורט מגיע אחרי הנקודתיים בכתובת המקומית.','Try `ss -lntp | grep healthd`. The port follows the colon in the local address.']],
  answer:['9093']},
 {title:['בדיקת שלמות','File Integrity'],level:2,
  brief:['בתיקיית `evidence` שמורים שלושה קובצי תצורה וחתימות SHA-256 מהגרסה המאושרת.','The `evidence` directory contains three configuration files and SHA-256 checksums from the approved version.'],
  task:['בדוק את הקבצים מול הרשימה והגש את שם הקובץ ששונה, כולל הסיומת.','Check the files against the checksum list and submit the changed filename, including its extension.'],
  hints:[['נווט אל `evidence` עם `cd evidence` ובדוק מה קיים שם.','Use `cd evidence` to enter the directory and check its contents.'],['השתמש ב־`sha256sum -c SHA256SUMS`. רשומה עם `FAILED` לא תואמת לחתימה המאושרת.','Use `sha256sum -c SHA256SUMS`. An entry marked `FAILED` differs from the approved checksum.']],
  files:{'evidence/api.conf':'port=8080','evidence/worker.conf':'workers=12','evidence/health.conf':'interval=30'},answer:['worker.conf']},
 {title:['חקירת תקלה משולבת','Incident Triage'],level:2,
  brief:['מערכת הניטור דיווחה על כשל רצוף. `alerts.log` מכיל מזהה בדיקה, `routes.tsv` ממפה בדיקות לשירותים ויומן השירות כולל את סיבת הכשל.','Monitoring reported a sustained failure. `alerts.log` contains a check ID, `routes.tsv` maps checks to services, and the service journal records the cause.'],
  task:['הצלב את שלושת המקורות והגש את שם השירות המלא ואת הערך של `reason` באותה פקודה. התבנית היא `submit SERVICE REASON`.','Correlate the three sources and submit the full unit name and its `reason` value together. Use `submit SERVICE REASON`.'],
  hints:[['חפש `CRITICAL` ב־`alerts.log`, ואז חפש את מזהה הבדיקה שקיבלת ב־`routes.tsv`.','Find `CRITICAL` in `alerts.log`, then look up its check ID in `routes.tsv`.'],['העבר את שם השירות שמצאת אל `journalctl -u`, וסנן את הפלט עם `| grep ERROR`.','Pass the mapped service name to `journalctl -u`, then filter its output with `| grep ERROR`.']],
  files:{'alerts.log':'09:00 INFO check=CH-71 status=ok\n09:01 WARN check=CH-10 status=slow\n09:04 CRITICAL check=CH-27 status=failed\n09:06 INFO check=CH-71 status=ok','routes.tsv':'check\tunit\nCH-10\tapi.service\nCH-71\tbackup.service\nCH-27\tcollector.service'},
  answer:['collector.service','schema_mismatch']}
];

const home = '/home/student';
const key = 'linux-rooms-progress-v1';
const copy = {
 title:['חדרי לינוקס','Linux Rooms'],
 tagline:['עשרה חדרים. בכל חדר, משימה אחת בטרמינל.','Ten rooms. One terminal challenge in each.'],
 rooms:['מפת החדרים','Room map'], progress:['חדרים שהושלמו','Rooms completed'],

const commonHelp = 'pwd · ls [-al] [PATH] · cd [DIR] · cat FILE · whoami\nclear · hint · submit ANSWER · help';

function tokenize(line) {
 const stages=[[]];
 let word='', quote='', started=false;
 const flush=()=>{
  if(started) stages.at(-1).push(word);
  word='';
  started=false;
 };
 for(let i=0;i<line.length;i++) {
  const ch=line[i];
  if(ch==='\\' && quote!=="'") {
   if(++i===line.length) throw Error('syntax error: trailing escape');
   word+=line[i]; started=true;
  } else if(quote) {
   if(ch===quote) quote='';
   else word+=ch;
  } else if(ch==="'" || ch==='"') {
   quote=ch; started=true;
  } else if(ch==='|') {
   flush(); stages.push([]);
  } else if(/\s/.test(ch)) flush();
  else {word+=ch; started=true;}
 }
 if(quote) throw Error('syntax error: unclosed quote');
 flush();
 if(stages.some(stage=>!stage.length)) throw Error('syntax error: empty pipeline stage');
 return stages;
}
function options(args,allowed,command) {
 const flags=new Set(), operands=[];
 let parseFlags=true;
 for(const arg of args) {
  if(parseFlags && arg==='--') {parseFlags=false;continue;}
  if(!parseFlags || arg.length<2 || !arg.startsWith('-')) {operands.push(arg);continue;}
  for(const char of arg.slice(1)) {
   if(!allowed.includes(char)) throw Error(command+': unsupported option -'+char);
   flags.add(char);
  }
 }
 return {flags,operands};
}
function displayMode(mode) {
 return [...mode].map(d=>[4,2,1].map((bit,i)=>(Number(d)&bit)?'rwx'[i]:'-').join('')).join('');
}
function listFiles(args,state) {
 const {flags,operands}=options(args,'al','ls');
 if(operands.length>1) throw Error('usage: ls [-al] [PATH]');
 const target=resolvePath(operands[0]??'.',state);
 const display=(name,path)=>{
  const file=state.files.get(path);
  if(!flags.has('l')) return name;
  const mode=displayMode(file?.mode??'755');
  const size=file ? new TextEncoder().encode(file.content+'\n').length : 4096;
  return (file?'-':'d')+mode+'  '+(file?'1':'2')+' student student '+String(size).padStart(4)+'  '+name;
 };
 if(state.files.has(target)) return display(operands[0],target)+'\n';
 if(!state.dirs.has(target)) throw Error('ls: '+(operands[0]??'.')+': No such file or directory');
 const paths=[...state.dirs,...state.files.keys()].filter(path=>path!=='/' && dirname(path)===target).sort();
 const lines=paths.filter(path=>flags.has('a')||!basename(path).startsWith('.')).map(path=>display(basename(path),path));
 if(flags.has('a')) lines.unshift(display('.',target),display('..',dirname(target)));
 return lines.length ? lines.join(flags.has('l')?'\n':'  ')+'\n' : '';
}
function readFile(name,state) {
 const target=resolvePath(name,state);
 const file=state.files.get(target);
 if(!file) throw Error(name+': '+(state.dirs.has(target)?'Is a directory':'No such file or directory'));
 if(!(Number(file.mode[0])&4)) throw Error(name+': Permission denied');
 return file.content+'\n';
}
const splitLines = value => value===''?[]:value.replace(/\n$/,'').split('\n');
const outputLines = lines => lines.length?lines.join('\n')+'\n':'';
function readInput(operands,input,command,state) {
 if(operands.length>1 || (!operands.length && input===null)) throw Error('usage: '+command+' [FILE] (or pipe input)');
 return operands.length ? readFile(operands[0],state) : input;
}
function checksum(name,state) {
 const data=readFile(name,state);
 const hash=Object.hasOwn(fixtureHashes,data)?fixtureHashes[data]:null;
 if(!hash) throw Error('sha256sum: '+name+': no checksum fixture in this room');
 return hash;
}
function shell(args,state,input) {
 const [cmd,...rest]=args;
 switch(cmd) {
  case 'pwd': return state.cwd+'\n';
  case 'whoami': return 'student\n';
  case 'ls': return listFiles(rest,state);
  case 'cd': {
   if(rest.length>1) throw Error('usage: cd [DIR]');
   const path=resolvePath(rest[0]??home,state);
   if(!state.dirs.has(path)) throw Error('cd: '+rest[0]+': directory not found');
   state.cwd=path;
   return '';
  }
  case 'cat': {
   if(!rest.length) throw Error('usage: cat FILE');
   return rest.map(name=>readFile(name,state)).join('');
  }
  case 'grep': {
   const {flags,operands}=options(rest,'Finv','grep');
   if(!operands.length) throw Error('usage: grep [-inv] TEXT [FILE]');
   const [pattern,...files]=operands;
   const needle=flags.has('i')?pattern.toLowerCase():pattern;
   const lines=splitLines(readInput(files,input,'grep TEXT',state));
   const result=[];
   lines.forEach((line,i)=>{
    const haystack=flags.has('i')?line.toLowerCase():line;
    if(haystack.includes(needle)!==flags.has('v')) result.push((flags.has('n')?(i+1)+':':'')+line);
   });
   return outputLines(result);
  }
  case 'sort': {
   const {flags,operands}=options(rest,'nr','sort');
   const lines=splitLines(readInput(operands,input,'sort',state));
   const compare=(a,b)=>a===b?0:a<b?-1:1;
   lines.sort((a,b)=>{
    const delta=flags.has('n')?(parseFloat(a)||0)-(parseFloat(b)||0):0;
    return (flags.has('r')?-1:1)*(delta||compare(a,b));
   });
   return outputLines(lines);
  }
  case 'uniq': {
   const {flags,operands}=options(rest,'c','uniq');
   const lines=splitLines(readInput(operands,input,'uniq',state));
   const groups=[];
   for(const line of lines) {
    if(groups.at(-1)?.line===line) groups.at(-1).count++;
    else groups.push({line,count:1});
   }
   return outputLines(groups.map(({line,count})=>flags.has('c')?String(count).padStart(7)+' '+line:line));
  }
  case 'chmod': {
   if(rest.length!==2 || !/^[0-7]{3}$/.test(rest[0])) throw Error('usage: chmod MODE FILE (three octal digits)');
   const file=state.files.get(resolvePath(rest[1],state));
   if(!file) throw Error('chmod: '+rest[1]+': file not found');
   file.mode=rest[0];
   return '';
  }
  case 'ps': {
   if(active!==5) throw Error('ps: process table is available in room 06');
   if(rest.length && !['aux','aux --sort=-%cpu'].includes(rest.join(' '))) throw Error('usage: ps aux [--sort=-%cpu]');
   const rows=rest.length===2?[...processes].sort((a,b)=>b.cpu-a.cpu):processes;
   return outputLines(['USER         PID  %CPU  %MEM  COMMAND',...rows.map(p=>p.user.padEnd(9)+String(p.pid).padStart(7)+p.cpu.toFixed(1).padStart(6)+p.mem.padStart(6)+'  '+p.name)]);
  }
  case 'systemctl':
  case 'journalctl': {
   const journal=cmd==='journalctl';
   if(rest.length!==2 || rest[0]!== (journal?'-u':'status')) throw Error('usage: '+(journal?'journalctl -u UNIT':'systemctl status UNIT'));
   const unit=rest[1].endsWith('.service')?rest[1]:rest[1]+'.service';
   if(!((active===6 && unit==='backup.service')||(active===9 && Object.hasOwn(journals,unit)))) throw Error('Unit '+unit+' is not present in this room.');
   if(journal) return journals[unit]+'\n';
   const status=unit==='api.service'?'active (running)':'failed (Result: exit-code)';
   return '● '+unit+'\n   Loaded: loaded\n   Active: '+status+'\n';
  }
  case 'ip':
   if(active!==7) throw Error('ip: interface data is available in room 08');
   if(!['addr','a','address'].includes(rest.join(' '))) throw Error('usage: ip addr');
   return '1: lo: <LOOPBACK,UP>\n    inet 127.0.0.1/8 scope host lo\n2: eth0: <BROADCAST,UP>\n    inet 192.0.2.14/24 scope global eth0\n';
  case 'ss':
   if(active!==7) throw Error('ss: socket data is available in room 08');
   if(rest.length && !/^-([lntp]+)$/.test(rest.join(''))) throw Error('usage: ss -lntp');
   return (rest.join('').includes('p')?network:network.replace(/ +Process$| +users:.*$/gm,''))+'\n';
  case 'sha256sum': {
   if(rest.length===1) return checksum(rest[0],state)+'  '+rest[0]+'\n';
   if(rest.length!==2 || rest[0]!=='-c') throw Error('usage: sha256sum [-c] FILE');
   const entries=splitLines(readFile(rest[1],state)).map(line=>{
    const match=line.match(/^([0-9a-f]{64})  (.+)$/);
    if(!match) throw Error('sha256sum: improperly formatted checksum file');
    const [,hash,name]=match;
    try{return name+': '+(checksum(name,state)===hash?'OK':'FAILED');}
    catch{return name+': FAILED open or read';}
   });
   return outputLines(entries);
  }
  default: throw Error(cmd+': command not found. Type help.');
 }
}

function run(raw) {
 const state=session();
 state.history.push(raw);
 if(state.history.length>80) state.history.shift();
 state.historyPos=state.history.length;
 state.draft='';
 append(prompt()+' '+raw,'cmd');
 try {
  const stages=tokenize(raw);
  const [cmd,...args]=stages[0];
  if(['help','clear','hint','submit'].includes(cmd)) {
   if(stages.length!==1) throw Error(cmd+': use this command outside a pipeline');
   if(cmd==='help') {
    append(commonHelp+(roomHelp[active]?'\n'+roomHelp[active]:''),'info');
   } else if(cmd==='clear') clearLog();
   else if(cmd==='hint') showHint(true);
   else submit(args);
  } else {
   let result=null;
   for(const stage of stages) {
    if(stages.length>1 && ['cd','chmod'].includes(stage[0])) throw Error(stage[0]+': run this command outside a pipeline');
    result=shell(stage,state,result);
   }
   if(result) append(result.replace(/\n$/,''));
  }
 } catch (error) { append(error.message,'error'); }
 byId('prompt').textContent=prompt();
}
